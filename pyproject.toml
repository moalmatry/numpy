[project]
name = "numpy-study"
version = "0.1.0"
description = "Python project for studying NumPy"
readme = "README.md"
authors = [
    { name = "Mohamed Almatry", email = "moalmatry2000@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "xlrd>=2.0.2",
]

[project.scripts]
numpy-study = "numpy_study:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "notebook>=7.6.5",
]
